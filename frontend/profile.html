<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Smart Loan Management</title>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Global Styles -->
<link rel="stylesheet" href="style.css">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body{ background:#f4f7fb; }
/* Sidebar */
.sidebar{ position:fixed; top:0; left:0; width:250px; height:100vh; background:#0d6efd; padding-top:20px; color:white; z-index: 1000; display: flex; flex-direction: column; }
.sidebar h3{ text-align:center; margin-bottom:30px; font-weight:bold; }
.sidebar a{ display:block; padding:15px 25px; color:white; text-decoration:none; transition:.3s; cursor:pointer;}
.sidebar a:hover, .sidebar a.active{ background:rgba(255,255,255,.15); padding-left:35px; }
.sidebar i{ margin-right:10px; }
/* Main */
.main{ margin-left:250px; }
/* Navbar */
.topbar{ background:white; padding:15px 30px; box-shadow:0 3px 10px rgba(0,0,0,.08); display:flex; justify-content:space-between; align-items:center; }
.topbar h4{ margin:0; }
.profile{ display:flex; align-items:center; gap:10px; }
.card{ border:none; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.08); transition:.3s; }
/* Form Styling */
.form-control, .form-select { border-radius: 8px; padding: 12px; border: 1px solid #ced4da; }
.form-control:focus, .form-select:focus { box-shadow: none; border-color: #0d6efd; }
.form-label { font-weight: 600; color: #495057; }
</style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
<div>
<h3><i class="bi bi-bank2"></i> Smart Loan</h3>
<a href="dashboard.html" class=""><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="customers.html" class="admin-only"><i class="bi bi-people"></i> Customers</a>
<a href="loans.html" class=""><i class="bi bi-cash-stack"></i> <span class="sidebarLoansText">My Loans</span></a>
<a href="emi.html" class=""><i class="bi bi-credit-card"></i> Repayments</a>
<a href="ai-insights.html" class=""><i class="bi bi-cpu"></i> AI Insights</a>
<a href="profile.html" class=""><i class="bi bi-person"></i> Profile</a>
<a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- AI Help Card pushed to bottom -->
<div class="mt-auto p-3 mb-5 mx-3 rounded" style="background: rgba(255, 255, 255, 0.15);">
    <h6 class="text-white fw-bold"><i class="bi bi-robot me-2"></i>Need Help?</h6>
    <p class="text-white-50" style="font-size: 0.85rem; margin-bottom: 10px;">Ask our AI assistant about your loans and EMIs.</p>
    <button class="btn btn-light btn-sm w-100 fw-bold text-primary" onclick="if(window.toggleVoiceAssistant) toggleVoiceAssistant();">
        <i class="bi bi-mic-fill me-1"></i> Talk to AI
    </button>
</div>
</div>
<div class="main">
<!-- Top Navbar -->
<div class="topbar">
<div>
<h4>My Profile</h4>
<small class="text-muted" id="welcomeMsg">Welcome back, Customer</small>
</div>
<div class="profile">
<i class="bi bi-bell-fill fs-4 text-secondary"></i>
<div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center" style="width:45px;height:45px;font-size:20px;" id="profileAvatar">C</div>
</div>
</div>

<!-- Page Content -->
<div class="container-fluid p-4">
<div class="row justify-content-center">
<div class="col-lg-8">

<div class="card p-5">
<div class="d-flex align-items-center mb-4">
<div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center me-3 shadow" style="width:80px;height:80px;font-size:35px;" id="largeAvatar">C</div>
<div>
<h3 class="mb-0 fw-bold" id="displayName">Customer Name</h3>
<p class="text-muted mb-0" id="displayEmail">customer@example.com</p>
<span class="badge bg-success mt-2">Verified Account</span>
</div>
</div>

<hr class="mb-4">

<form id="profileForm">
<div id="statusMessage"></div>

<h5 class="mb-3 text-primary"><i class="bi bi-person-lines-fill me-2"></i>Personal Details</h5>
<div class="row g-3 mb-4">
    <div class="col-md-6">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control bg-light" id="firstName" disabled>
    </div>
    <div class="col-md-6">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control bg-light" id="lastName" disabled>
    </div>
    <div class="col-md-6">
        <label class="form-label">Email Address (Cannot be changed)</label>
        <input type="email" class="form-control bg-light" id="email" disabled>
    </div>
    <div class="col-md-6">
        <label class="form-label">Mobile Number</label>
        <input type="text" class="form-control" id="mobile" required>
    </div>
    <div class="col-12">
        <label class="form-label">Residential Address</label>
        <textarea class="form-control" id="address" rows="2" required></textarea>
    </div>
</div>

<h5 class="mb-3 text-primary"><i class="bi bi-briefcase-fill me-2"></i>Financial Details</h5>
<div class="row g-3 mb-4">
    <div class="col-md-6">
        <label class="form-label">Occupation / Job Title</label>
        <input type="text" class="form-control" id="occupation" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Monthly Income (?)</label>
        <input type="number" class="form-control" id="income" min="0" required>
    </div>
</div>

<div class="d-flex justify-content-end mt-2">
    <button type="submit" class="btn btn-primary px-5 py-2 fw-bold" id="saveBtn">
        <i class="bi bi-floppy-fill me-2"></i>Save Changes
    </button>
</div>
</form>

</div>

</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="profile.js?v=2"></script>
</body>
</html>
