<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart Loan Management</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Global Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body{ min-height:100vh; background:linear-gradient(135deg,#0d6efd,#5ea8ff); display:flex; justify-content:center; align-items:center; padding:20px; }
        .login-card{ width:420px; max-width:100%; background:white; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.2); overflow:hidden; }
        .login-form-side{ padding:45px 40px; }
        .logo{ font-size:55px; color:#0d6efd; }
        .btn-primary{ width:100%; padding:10px; font-size:18px; }
        a{ text-decoration:none; }
        /* Hide Microsoft Edge password icon */
        input[type=password]::-ms-reveal, input[type=password]::-ms-clear{ display:none; }
    </style>
</head>
<body>
<div class="login-card">

    <!-- Form Side -->
    <div class="login-form-side">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock logo"></i>
            <h2>Reset Password</h2>
            <p class="text-muted" id="page-subtitle">Verify your email to reset password</p>
        </div>
        
        <!-- Step 1: Verification Form -->
        <form id="verifyForm">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your registered email" required>
            </div>
            
            <div id="verifyMsg" style="display:none;"></div>
            
            <button type="button" id="verifyBtn" class="btn btn-primary" onclick="sendResetOTP()">
                <i class="bi bi-envelope"></i> Send OTP
            </button>
        </form>

        <!-- Step 2: Reset Password Form (Hidden Initially) -->
        <form id="resetForm" style="display: none;">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required>
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('newPassword', 'eyeIcon1')">
                        <i class="bi bi-eye" id="eyeIcon1"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required>
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword', 'eyeIcon2')">
                        <i class="bi bi-eye" id="eyeIcon2"></i>
                    </button>
                </div>
            </div>
            
            <div id="resetMsg" style="display:none;"></div>
            
            <button type="button" id="resetBtn" class="btn btn-primary" onclick="resetPassword()">
                <i class="bi bi-key"></i> Update Password
            </button>
        </form>

        <div class="text-center mt-4">
            Remembered your password? <a href="login.html">Login here</a>
        </div>
    </div>
</div>

<!-- OTP Verification Modal -->
<div class="modal fade" id="otpModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Email Verification</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center pb-5">
        <p class="text-muted mb-4">We've sent a 4-digit code to your email.<br>Please enter it below to verify your account.</p>
        
        <div class="d-flex justify-content-center gap-2 mb-4">
          <input type="text" class="form-control otp-input text-center fs-4 fw-bold" id="otp1" maxlength="1" style="width: 50px; height: 60px;">
          <input type="text" class="form-control otp-input text-center fs-4 fw-bold" id="otp2" maxlength="1" style="width: 50px; height: 60px;">
          <input type="text" class="form-control otp-input text-center fs-4 fw-bold" id="otp3" maxlength="1" style="width: 50px; height: 60px;">
          <input type="text" class="form-control otp-input text-center fs-4 fw-bold" id="otp4" maxlength="1" style="width: 50px; height: 60px;">
        </div>
        
        <div id="otpMsg" class="alert alert-danger" style="display:none; font-size:14px;"></div>
        
        <button class="btn btn-primary w-100 py-2 mb-3" onclick="verifyOTPAndShowReset()">Verify OTP</button>
        <p class="text-muted small mb-0">Didn't receive the code? <a href="#" onclick="sendResetOTP()" class="text-decoration-none">Resend</a></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="forgot-password.js"></script>
</body>
</html>
