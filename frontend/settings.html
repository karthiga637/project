<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | Smart Loan Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="common.js"></script>
<script>initAuthGuard(['Admin']);</script>
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f7fc;
overflow-x:hidden;
}

.sidebar{
position:fixed;
top:0;
left:0;
width:250px;
height:100vh;
background:#0d6efd;
color:white;
padding-top:20px;
}

.sidebar h3{
text-align:center;
margin-bottom:30px;
font-weight:bold;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:15px 25px;
transition:.3s;
}

.sidebar a:hover{
background:rgba(255,255,255,.15);
padding-left:35px;
}

.sidebar a.active{
background:rgba(255,255,255,.25);
border-left:5px solid white;
}

.sidebar i{
margin-right:10px;
}

.main{
margin-left:250px;
min-height:100vh;
}

.topbar{
background:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.profile{
display:flex;
align-items:center;
gap:15px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
}

.container-box{
padding:30px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:25px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h3>

<i class="bi bi-bank2"></i>

Smart Loan

</h3>

<a href="#" onclick="goToDashboard(); return false;"><i class="bi bi-speedometer2"></i> Dashboard</a>

<a href="customer.html">

<i class="bi bi-people-fill"></i>

Customers

</a>

<a href="loans.html">

<i class="bi bi-cash-stack"></i>

Loan Monitoring

</a>

<a href="emi.html">

<i class="bi bi-credit-card"></i>

EMI Tracking

</a>


<a href="reports.html">

<i class="bi bi-file-earmark-bar-graph"></i>

Reports

</a>

<a href="settings.html" class="active">

<i class="bi bi-gear-fill"></i>

Settings

</a>

<a href="login.html">

<i class="bi bi-box-arrow-right"></i>

Logout

</a>

</div>

<!-- Main Content -->

<div class="main">

<div class="topbar">

<div>

<h4>

Settings

</h4>

<small class="text-muted">

Manage your account and system preferences

</small>

</div>

<div class="profile">

<i class="bi bi-bell-fill fs-4"></i>

<img src="https://i.pravatar.cc/100" alt="Admin">

</div>

</div>

<div class="container-box">

<!-- Admin Profile -->

<div class="card">

<div class="card-header bg-primary text-white">

<h5 class="mb-0">

Admin Profile

</h5>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
class="form-control"
value="Administrator">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Role

</label>

<input
type="text"
class="form-control"
value="System Administrator"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
class="form-control"
value="admin@smartloan.com">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mobile Number

</label>

<input
type="tel"
class="form-control"
value="9876543210">

</div>

</div>

</div>

</div>

<!-- Change Password -->

<div class="card">

<div class="card-header bg-primary text-white">

<h5 class="mb-0">

Change Password

</h5>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Current Password

</label>

<div class="input-group">

<input
type="password"
class="form-control"
id="currentPassword">

<button
class="btn btn-outline-secondary"
type="button"
onclick="togglePassword('currentPassword',this)">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

New Password

</label>

<div class="input-group">

<input
type="password"
class="form-control"
id="newPassword">

<button
class="btn btn-outline-secondary"
type="button"
onclick="togglePassword('newPassword',this)">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Confirm Password

</label>

<div class="input-group">

<input
type="password"
class="form-control"
id="confirmPassword">

<button
class="btn btn-outline-secondary"
type="button"
onclick="togglePassword('confirmPassword',this)">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

</div>

</div>

</div>
<!-- Email Settings -->

<div class="card">

<div class="card-header bg-primary text-white">

<h5 class="mb-0">

Email Settings

</h5>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Notification Email

</label>

<input
type="email"
class="form-control"
value="admin@smartloan.com">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Monthly Report Email

</label>

<input
type="email"
class="form-control"
value="reports@smartloan.com">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

AI Alert Email

</label>

<input
type="email"
class="form-control"
value="alerts@smartloan.com">

</div>

</div>

</div>

</div>

<!-- Notification Settings -->

<div class="card">

<div class="card-header bg-primary text-white">

<h5 class="mb-0">

Notification Settings

</h5>

</div>

<div class="card-body">

<div class="form-check form-switch mb-3">

<input
class="form-check-input"
type="checkbox"
id="emiReminder"
checked>

<label class="form-check-label" for="emiReminder">

Enable EMI Reminder Notifications

</label>

</div>

<div class="form-check form-switch mb-3">

<input
class="form-check-input"
type="checkbox"
id="riskAlert"
checked>

<label class="form-check-label" for="riskAlert">

Enable AI Risk Alerts

</label>

</div>

<div class="form-check form-switch mb-3">

<input
class="form-check-input"
type="checkbox"
id="emailNotification"
checked>

<label class="form-check-label" for="emailNotification">

Enable Email Notifications

</label>

</div>

<div class="form-check form-switch">

<input
class="form-check-input"
type="checkbox"
id="smsNotification">

<label class="form-check-label" for="smsNotification">

Enable SMS Notifications

</label>

</div>

</div>

</div>

<!-- Appearance -->

<div class="card">

<div class="card-header bg-primary text-white">

<h5 class="mb-0">

Appearance

</h5>

</div>

<div class="card-body">

<div class="form-check form-switch">

<input
class="form-check-input"
type="checkbox"
id="darkMode">

<label class="form-check-label" for="darkMode">

Enable Dark Mode

</label>

</div>

</div>

</div>

<!-- Buttons -->

<div class="text-end mb-4">

<button class="btn btn-secondary me-2" type="reset">

<i class="bi bi-arrow-counterclockwise"></i>

Reset

</button>

<button class="btn btn-primary">

<i class="bi bi-save"></i>

Save Changes

</button>

</div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="settings.js"></script>

</body>

</html>
