<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Smart Loan Management</title>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Global Styles -->
<link rel="stylesheet" href="style.css">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}
body{
min-height:100vh;
background:linear-gradient(135deg,#0d6efd,#5ea8ff);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
.register-card{
width:550px;
max-width:100%;
background:white;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
overflow:hidden;
}
.register-form-side{
padding:40px;
}
.logo{
font-size:50px;
color:#0d6efd;
}
.btn-primary{
width:100%;
padding:10px;
font-size:18px;
}
a{
text-decoration:none;
}
/* Hide Microsoft Edge password icon */
input[type=password]::-ms-reveal,
input[type=password]::-ms-clear{
display:none;
}
</style>
</head>
<body>
<div class="register-card">

<!-- Form Side -->
<div class="register-form-side">
<div class="text-center mb-4">
<i class="bi bi-bank2 logo"></i>
<h2>Create Account</h2>
<p class="text-muted">
Join Smart Loan Management
</p>
</div>
<form>
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">
First Name
</label>
<input
type="text"
id="firstName"
class="form-control"
placeholder="First Name"
required>
</div>
<div class="col-md-6 mb-3">
<label class="form-label">
Last Name
</label>
<input
type="text"
id="lastName"
class="form-control"
placeholder="Last Name"
required>
</div>
</div>
<div class="mb-3">
<label class="form-label">
Email Address
</label>
<input
type="email"
id="email"
class="form-control"
placeholder="Enter your email"
required>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">
Password
</label>
<div class="input-group">
<input
type="password"
id="password"
class="form-control"
placeholder="Password"
required>
<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword('password','eyeIcon1')">
<i class="bi bi-eye" id="eyeIcon1"></i>
</button>
</div>
</div>
<div class="col-md-6 mb-3">
<label class="form-label">
Confirm Password
</label>
<div class="input-group">
<input
type="password"
id="confirmPassword"
class="form-control"
placeholder="Confirm"
required>
<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword('confirmPassword','eyeIcon2')">
<i class="bi bi-eye" id="eyeIcon2"></i>
</button>
</div>
</div>
</div>

<!-- Register Button -->
<div id="registerMsg" style="display:none;"></div>
<button
type="button"
id="registerBtn"
class="btn btn-primary"
onclick="registerUser()">
<i class="bi bi-person-plus-fill"></i>
Create Account
</button>



<div class="text-center">
Already have an account?
<a href="login.html">
Login Here
</a>
</div>
</form>

</div>

</div>

<script src="register.js"></script>

<!-- Simulated Google Login Modal -->
<div class="modal fade" id="googleLoginModal" tabindex="-1" aria-labelledby="googleLoginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius: 12px; overflow: hidden; border: none; box-shadow: 0 15px 35px rgba(0,0,0,0.2);">
      <div class="modal-header border-0 pb-0 justify-content-center position-relative">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
        <div class="text-center mt-3">
          <svg width="40" height="40" viewBox="0 0 48 48" class="mb-3">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12 c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24 c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039 l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36 c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571 c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24 C44,22.659,43.862,21.35,43.611,20.083z"/>
          </svg>
          <h4 class="mb-1 fw-bold" style="font-family: 'Product Sans', sans-serif;">Sign up</h4>
          <p class="text-muted">to continue to <strong>Smart Loan</strong></p>
        </div>
      </div>
      <div class="modal-body px-4 pb-5 pt-2">
        <div class="d-flex align-items-center p-3 mb-3 border rounded account-card" style="cursor: pointer; transition: 0.2s;" onclick="simulateGoogleLogin('Rahul Kumar', 'rahul@example.com')" onmouseover="this.style.backgroundColor='#f1f3f4'" onmouseout="this.style.backgroundColor='transparent'">
          <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center me-3 fs-5 fw-bold" style="width: 40px; height: 40px;">R</div>
          <div class="flex-grow-1">
            <h6 class="mb-0 fw-bold">Rahul Kumar</h6>
            <small class="text-muted">rahul@example.com</small>
          </div>
        </div>
        <div class="d-flex align-items-center p-3 border rounded account-card" style="cursor: pointer; transition: 0.2s;" onclick="simulateGoogleLogin('Priya Sharma', 'priya@example.com')" onmouseover="this.style.backgroundColor='#f1f3f4'" onmouseout="this.style.backgroundColor='transparent'">
          <div class="rounded-circle bg-success text-white d-flex justify-content-center align-items-center me-3 fs-5 fw-bold" style="width: 40px; height: 40px;">P</div>
          <div class="flex-grow-1">
            <h6 class="mb-0 fw-bold">Priya Sharma</h6>
            <small class="text-muted">priya@example.com</small>
          </div>
        </div>
        <p class="text-muted text-center mt-4 mb-0" style="font-size: 13px;">To continue, Google will share your name, email address, and profile picture with Smart Loan.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
