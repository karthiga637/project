<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | Smart Loan Management</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f4f7fb, #e2e8f0);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }
        .logout-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.5s ease-out;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            color: #198754;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }
        h2 {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .btn-primary {
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 10px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="logout-card">
        <div class="icon-circle">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2>Logged Out</h2>
        <p>You have been successfully signed out of your Smart Loan account. Have a great day!</p>
        
        <a href="login.html" class="btn btn-primary w-100 mb-2">
            <i class="bi bi-box-arrow-in-right me-2"></i> Log back in
        </a>
        <a href="index.html" class="btn btn-outline-secondary w-100">
            <i class="bi bi-house me-2"></i> Return to Home
        </a>
    </div>

    <script>
        // Ensure user session is cleared when hitting this page
        localStorage.removeItem('slm_session');
        
        // Prevent going back to authenticated pages via browser history
        window.history.pushState(null, "", window.location.href);
        window.onpopstate = function () {
            window.history.pushState(null, "", window.location.href);
        };
    </script>
</body>
</html>
